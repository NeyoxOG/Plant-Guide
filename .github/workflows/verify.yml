name: Verify Plant Guide CMS

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check 'functions/api/[[path]].js'
          node --check 'functions/media/[[key]].js'
          node --check public/admin-v2.js
          node --check public/cms-public.js
          node --check public/app.js
          node --check public/effects.js
      - name: Verify required Cloudflare files
        run: |
          test -f public/index.html
          test -f public/admin.html
          test -f schema.sql
          test -f wrangler.toml
          grep -q 'pages_build_output_dir = "./public"' wrangler.toml
          grep -q 'ADMIN_USERNAME = "Nicole"' wrangler.toml
          grep -q 'id="username"' public/admin.html
          grep -q 'id="connectionBadge"' public/admin.html
      - name: Prevent credential leaks
        shell: bash
        run: |
          if grep -R --exclude-dir=.git --exclude='verify.yml' -n 'SeufertNic' .; then
            echo 'A production password appears in tracked files.' >&2
            exit 1
          fi
